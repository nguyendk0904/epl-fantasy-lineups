# =====================================================================
# P1-Q02 - Local Full-Stack Docker Compose
# Project: Fantasy Football Lineup Builder & Optimizer
#
# Services:
#   - postgres : PostgreSQL 15 (named volume persists data across restarts)
#   - backend  : FastAPI (built from backend/Dockerfile, P1-Q01)
#   - frontend : React/Vite SPA (built from frontend/Dockerfile, P1-Q01,
#                served by Nginx, /api/* reverse-proxied to backend)
#
# Startup order enforced by healthchecks:
#   postgres (healthy) -> backend (healthy) -> frontend
#
# Usage:
#   docker compose -f infra/docker-compose.yml up --build
#   Frontend : http://localhost:5173
#   Backend  : http://localhost:8000/docs
#   Postgres : localhost:5432
# =====================================================================

name: fpl-local

services:
  postgres:
    image: postgres:15-alpine
    container_name: fpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fantasy_fpl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persist DB data across container restarts / rebuilds
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE on first initialization (extensions/settings only,
      # business tables are handled by Alembic migrations - P1-V01)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fpl-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fpl-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8000
      # "postgres" resolves to the compose service via embedded DNS
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fantasy_fpl}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173", "http://localhost:3000"]}'
      FPL_BOOTSTRAP_URL: ${FPL_BOOTSTRAP_URL:-https://fantasy.premierleague.com/api/bootstrap-static/}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fpl-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Relative base URL => /api/* requests are proxied by Nginx to backend
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: fpl-frontend
    restart: unless-stopped
    ports:
      # Host 5173 -> container Nginx :80 (SPA + /api proxy)
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fpl-network

volumes:
  pgdata:
    name: fpl-pgdata

networks:
  fpl-network:
    driver: bridge