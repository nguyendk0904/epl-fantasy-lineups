# =====================================================================
# LEGACY / MANUAL ONLY  (decision D-5 of P3-Q03)
# Project: Fantasy Football Lineup Builder & Optimizer
#
# Production frontend is a Vite build published to S3 + CloudFront
# (P3-Q01), automated by .github/workflows/ci_cd.yml on every push/merge
# into `main` (P3-Q03).
#
# This workflow previously ALSO ran on every push to `main` (and to two
# retired feature branches), so one release triggered two competing
# frontend deployments. Whenever GitHub Pages is disabled - or a run
# loses the race for the `pages` concurrency group - the Actions tab
# turns red even though the real (AWS) deployment is healthy, which makes
# the P3-Q03 acceptance signal ("all green on main") meaningless.
#
# It is kept for optional demos / emergency rollback and is therefore
# MANUAL ONLY: Actions -> "Deploy Frontend to GitHub Pages" -> Run
# workflow. Do NOT re-add a `push:` trigger here while CloudFront is the
# production origin.
# =====================================================================
name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

